name: Maestrale
options:
  bundleIdPrefix: it.nico
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  MaestraleKit:
    path: Packages/MaestraleKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Maestrale:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: MaestraleKit
        product: MaestraleCore
      - package: MaestraleKit
        product: MaestraleModules
      # Privileged helper, next to the app's executable (Contents/MacOS/mshelper).
      - target: mshelper
        embed: true
        codeSign: false
        copy:
          destination: executables
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Maestrale
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: © 2026 Nicola Milella · MIT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.nico.maestrale
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        # Not sandboxed: the app must read and clean folders across the home.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        # Ad-hoc signing for local use. Switch to your Apple ID team when the
        # privileged helper (SMAppService) is added.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Xcode skips the hardened runtime when signing ad-hoc: ask codesign for
        # it. Release only: in Debug the app loads its own debug dylib and the
        # test bundle, which an ad-hoc hardened process refuses.
        Release:
          OTHER_CODE_SIGN_FLAGS: "--options=runtime"

  # The only code that touches system files as root. AdminRunner copies it to a
  # root-only folder, checks its hash and runs it after the password prompt.
  mshelper:
    type: tool
    platform: macOS
    sources: [Packages/MaestraleKit/Sources/mshelper]
    dependencies:
      - package: MaestraleKit
        product: MaestraleCore
    settings:
      base:
        PRODUCT_NAME: mshelper
        ENABLE_HARDENED_RUNTIME: YES
        # The helper loads no libraries of its own, so it can always run hardened.
        OTHER_CODE_SIGN_FLAGS: "--options=runtime"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SKIP_INSTALL: YES

  # Tests of the app's own logic (selection, scans). They run inside the app.
  MaestraleTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AppTests]
    dependencies:
      - target: Maestrale
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Maestrale.app/Contents/MacOS/Maestrale"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: it.nico.maestrale.tests

schemes:
  Maestrale:
    build:
      targets:
        Maestrale: all
    test:
      targets:
        - MaestraleTests
        - package: MaestraleKit/MaestraleCoreTests
        - package: MaestraleKit/MaestraleModulesTests
